# Configuración de Nginx para Sabor App - Producción

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Configuración de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Configuración de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Configuración de caché
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    1M;
        ~font/                     1M;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=200r/m;

    # Upstream para la aplicación Node.js
    upstream sabor_app {
        server app:3000;
        keepalive 32;
    }

    # Configuración del servidor principal
    server {
        listen 80;
        server_name _;
        
        # Redirigir HTTP a HTTPS en producción
        return 301 https://$server_name$request_uri;
    }

    # Configuración HTTPS
    server {
        listen 443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        # Certificados SSL (configurar según tu proveedor)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Configuración SSL moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://sabor-production.up.railway.app http://localhost:3000;" always;

        # Configuración de caché
        expires $expires;

        # Tamaño máximo de carga
        client_max_body_size 10M;

        # Configuración de proxy
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Servir archivos estáticos directamente
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Seguridad para archivos subidos
            location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
            
            # Rate limiting para archivos estáticos
            limit_req zone=static burst=50 nodelay;
        }

        # Servir frontend estático (si se sirve desde Nginx)
        location / {
            try_files $uri $uri/ @backend;
            
            # Headers para SPA
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Proxy para API del backend
        location /api/ {
            # Rate limiting para API general
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://sabor_app;
            proxy_redirect off;
        }

        # Rate limiting más estricto para autenticación
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://sabor_app;
            proxy_redirect off;
        }

        # Health checks (sin rate limiting)
        location ~ ^/api/(health|ready|live)$ {
            proxy_pass http://sabor_app;
            proxy_redirect off;
            access_log off;
        }

        # WebSocket para Socket.IO
        location /socket.io/ {
            proxy_pass http://sabor_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback al backend para rutas no encontradas
        location @backend {
            proxy_pass http://sabor_app;
            proxy_redirect off;
        }

        # Bloquear acceso a archivos sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Página de mantenimiento
        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /var/www/html;
            internal;
        }

        # Páginas de error personalizadas
        error_page 404 /404.html;
        error_page 500 /500.html;
        
        location = /404.html {
            root /var/www/html;
            internal;
        }
        
        location = /500.html {
            root /var/www/html;
            internal;
        }
    }
}
