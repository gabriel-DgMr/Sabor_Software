components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtenido mediante login

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Error message"
        error:
          type: string
          example: "Detailed error information"
        errors:
          type: object
          additionalProperties:
            type: string
      required:
        - message

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 123
        email:
          type: string
          format: email
          example: "juan@example.com"
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Pérez"
        tipo_usuario:
          type: string
          enum: [cliente, empleado, administrador]
          example: "cliente"
        telefono:
          type: string
          example: "1234567890"
        direccion:
          type: string
          example: "Calle 123, Ciudad"
        activo:
          type: boolean
          example: true
        email_verificado:
          type: boolean
          example: true
        fecha_registro:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    User:
      type: object
      properties:
        id_user:
          type: integer
          example: 123
        email:
          type: string
          format: email
          example: "juan@example.com"
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Pérez"
        telefono:
          type: string
          example: "1234567890"
        imagen:
          type: string
          example: "profile.jpg"
        tipo_usuario:
          type: string
          enum: [cliente, empleado, administrador]
          example: "cliente"
        direccion:
          type: string
          example: "Calle 123, Ciudad"
        id_rol:
          type: integer
          example: 1
        activo:
          type: boolean
          example: true
        email_verificado:
          type: boolean
          example: true
        fecha_registro:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        fecha_modificacion:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Cliente:
      type: object
      properties:
        id_user:
          type: integer
          example: 123
        id_cliente:
          type: integer
          example: 456
        email:
          type: string
          format: email
          example: "juan@example.com"
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Pérez"
        telefono:
          type: string
          example: "1234567890"
        imagen:
          type: string
          example: "profile.jpg"
        activo:
          type: boolean
          example: true
        email_verificado:
          type: boolean
          example: true
        fecha_registro:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        fecha_modificacion:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Empleado:
      type: object
      properties:
        id_user:
          type: integer
          example: 123
        id_empleado:
          type: integer
          example: 789
        email:
          type: string
          format: email
          example: "empleado@restaurant.com"
        nombre:
          type: string
          example: "María"
        apellido:
          type: string
          example: "García"
        telefono:
          type: string
          example: "1234567890"
        imagen:
          type: string
          example: "profile.jpg"
        direccion:
          type: string
          example: "Calle 123, Ciudad"
        id_rol:
          type: integer
          example: 2
        nombre_rol:
          type: string
          example: "Mesero"
        activo:
          type: boolean
          example: true
        fecha_contratacion:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        fecha_modificacion:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Producto:
      type: object
      properties:
        id_producto:
          type: integer
          example: 1
        nombre_producto:
          type: string
          example: "Hamburguesa Clásica"
        descripcion_producto:
          type: string
          example: "Deliciosa hamburguesa con carne de res, lechuga, tomate y cebolla"
        precio_producto:
          type: number
          format: float
          example: 15.99
        imagen_producto:
          type: string
          example: "hamburguesa_clasica.jpg"
        id_categoria:
          type: integer
          example: 1
        nombre_categoria:
          type: string
          example: "Platos Principales"
        activo:
          type: boolean
          example: true
        calificacion:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
          example: 4.5
        ventas:
          type: integer
          example: 25

    Categoria:
      type: object
      properties:
        id_categoria:
          type: integer
          example: 1
        nombre_categoria:
          type: string
          example: "Platos Principales"
        descripcion_categoria:
          type: string
          example: "Nuestros platos principales del menú"
        activo:
          type: boolean
          example: true

    Pedido:
      type: object
      properties:
        _id:
          type: integer
          example: 123
        id_pedido:
          type: integer
          example: 123
        userId:
          type: integer
          example: 456
        total:
          type: number
          format: float
          example: 31.98
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        estado:
          type: string
          example: "Pendiente"
        recomendaciones:
          type: string
          example: "Sin cebolla, por favor"
        notas:
          type: string
          example: "Sin cebolla, por favor"
        items:
          type: array
          items:
            type: object
            properties:
              id_producto:
                type: integer
                example: 1
              cantidad:
                type: integer
                example: 2
              precio_unitario:
                type: number
                format: float
                example: 15.99
              subtotal:
                type: number
                format: float
                example: 31.98
              nombre_producto:
                type: string
                example: "Hamburguesa Clásica"
              imagen_producto:
                type: string
                example: "hamburguesa_clasica.jpg"
        items_str:
          type: string
          example: "2 x Hamburguesa Clásica, 1 x Coca Cola"

    Carrito:
      type: object
      properties:
        id_pedido:
          type: integer
          example: 123
        id_cliente:
          type: integer
          example: 456
        id_estado:
          type: integer
          example: 1
        total_pedido:
          type: number
          format: float
          example: 31.98
        metodo_pago:
          type: string
          example: "efectivo"
        items:
          type: array
          items:
            type: object
            properties:
              id_detalle:
                type: integer
                example: 789
              id_producto:
                type: integer
                example: 1
              nombre_producto:
                type: string
                example: "Hamburguesa Clásica"
              cantidad:
                type: integer
                example: 2
              precio_unitario:
                type: number
                format: float
                example: 15.99
              subtotal:
                type: number
                format: float
                example: 31.98
              imagen_producto:
                type: string
                example: "hamburguesa_clasica.jpg"

    Reserva:
      type: object
      properties:
        id_reservacion:
          type: integer
          example: 123
        id_cliente:
          type: integer
          example: 456
        numero_personas:
          type: integer
          example: 4
        fecha_reservacion:
          type: string
          format: date
          example: "2024-01-15"
        hora_reservacion:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "19:00"
        notas:
          type: string
          example: "Mesa cerca de la ventana"
        id_mesa:
          type: integer
          example: 5
        id_estado:
          type: integer
          example: 1
        fecha_creacion:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

