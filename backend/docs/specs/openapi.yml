openapi: 3.0.3
info:
  title: Sabor API
  description: API para el sistema de restaurante Sabor - Backend con autenticación JWT, gestión de productos, pedidos, reservas y usuarios
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo
    email: dev@sabor.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001
    description: Servidor de desarrollo local
  - url: https://api.sabor.com
    description: Servidor de producción

paths:
  # =================
  # AUTH ENDPOINTS
  # =================
  /api/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo usuario
      description: Registra un nuevo usuario en el sistema (por defecto como cliente)
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "http://localhost:3000/api/auth/register" \
              -H "Content-Type: application/json" \
              -d '{
                "nombre": "Juan",
                "apellido": "Pérez",
                "email": "juan@example.com",
                "telefono": "1234567890",
                "contraseña": "Password123!"
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - email
                - contraseña
              properties:
                nombre:
                  type: string
                  example: Juan
                apellido:
                  type: string
                  example: Pérez
                email:
                  type: string
                  format: email
                  example: juan@example.com
                telefono:
                  type: string
                  pattern: ^\d{10}$
                  example: "1234567890"
                contraseña:
                  type: string
                  minLength: 8
                  example: "Password123!"
                tipo_usuario:
                  type: string
                  enum: [cliente, empleado, administrador]
                  default: cliente
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario registrado exitosamente
                  userId:
                    type: integer
                    example: 123
        '400':
          description: Error en la validación de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "http://localhost:3000/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{
                "email": "juan@example.com",
                "contraseña": "Password123!"
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - contraseña
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
                contraseña:
                  type: string
                  example: "Password123!"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login exitoso
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/verify-email:
    post:
      tags:
        - Autenticación
      summary: Verificar correo electrónico
      description: Verifica el correo electrónico usando un código de verificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - codigo
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
                codigo:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Email verificado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verificado exitosamente
        '400':
          description: Código inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/resend-verification:
    post:
      tags:
        - Autenticación
      summary: Reenviar código de verificación
      description: Reenvía el código de verificación por correo electrónico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
      responses:
        '200':
          description: Código reenviado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Código enviado exitosamente
        '400':
          description: Error al reenviar código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Solicitar recuperación de contraseña
      description: Envía un enlace de recuperación de contraseña por correo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
      responses:
        '200':
          description: Enlace de recuperación enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Enlace de recuperación enviado
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/reset-password/{token}:
    get:
      tags:
        - Autenticación
      summary: Verificar token de recuperación
      description: Verifica si un token de recuperación de contraseña es válido
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Token de recuperación de contraseña
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token válido
        '400':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Autenticación
      summary: Restablecer contraseña
      description: Restablece la contraseña usando un token válido
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Token de recuperación de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nuevaContraseña
              properties:
                nuevaContraseña:
                  type: string
                  minLength: 8
                  example: "NewPassword123!"
      responses:
        '200':
          description: Contraseña restablecida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contraseña restablecida exitosamente
        '400':
          description: Token inválido o contraseña débil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Cierra la sesión del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesión cerrada exitosamente
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/perfil:
    get:
      tags:
        - Autenticación
      summary: Obtener perfil del usuario autenticado
      description: Retorna el perfil del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =================
  # PRODUCTOS ENDPOINTS
  # =================
  /api/productos:
    get:
      tags:
        - Productos
      summary: Obtener todos los productos
      description: Retorna una lista de todos los productos disponibles con filtros opcionales
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET "http://localhost:3000/api/productos?categoria=principales&busqueda=hamburguesa&lang=es" \
              -H "Accept: application/json"
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
          description: Filtrar por nombre de categoría
        - name: busqueda
          in: query
          schema:
            type: string
          description: Buscar por nombre o descripción
        - name: orden
          in: query
          schema:
            type: string
            enum: [precio_asc, precio_desc, nombre_asc, nombre_desc, calificacion_desc, ventas_desc]
          description: Ordenar resultados
        - name: lang
          in: query
          schema:
            type: string
            enum: [es, en]
            default: es
          description: Idioma de la respuesta
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Productos
      summary: Crear nuevo producto
      description: Crea un nuevo producto (solo para usuarios con permisos de gestión)
      x-code-samples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "http://localhost:3000/api/productos" \
              -H "Authorization: Bearer YOUR_JWT_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "nombre_producto=Hamburguesa Deluxe" \
              -F "descripcion_producto=Hamburguesa premium con ingredientes selectos" \
              -F "precio_producto=19.99" \
              -F "id_categoria_producto=1" \
              -F "imagen_producto=@/ruta/a/imagen.jpg" \
              -F "calificacion=4.5" \
              -F "ventas=10"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - nombre_producto
                - precio_producto
                - id_categoria_producto
                - imagen_producto
              properties:
                nombre_producto:
                  type: string
                  example: Hamburguesa Clásica
                descripcion_producto:
                  type: string
                  example: Deliciosa hamburguesa con carne de res
                precio_producto:
                  type: number
                  format: float
                  example: 15.99
                id_categoria_producto:
                  type: integer
                  example: 1
                imagen_producto:
                  type: string
                  format: binary
                  description: Imagen del producto (JPG, PNG, WEBP, max 5MB)
                calificacion:
                  type: number
                  format: float
                  minimum: 1.0
                  maximum: 5.0
                  example: 4.5
                ventas:
                  type: integer
                  example: 25
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto creado exitosamente
                  productoId:
                    type: integer
                    example: 123
        '400':
          description: Error en la validación de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener producto por ID
      description: Retorna un producto específico por su ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del producto
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Productos
      summary: Actualizar producto
      description: Actualiza un producto existente
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del producto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre_producto:
                  type: string
                  example: Hamburguesa Clásica Actualizada
                descripcion_producto:
                  type: string
                  example: Deliciosa hamburguesa con carne de res premium
                precio_producto:
                  type: number
                  format: float
                  example: 17.99
                id_categoria_producto:
                  type: integer
                  example: 1
                imagen_producto:
                  type: string
                  format: binary
                  description: Nueva imagen del producto (opcional)
                calificacion:
                  type: number
                  format: float
                  minimum: 1.0
                  maximum: 5.0
                  example: 4.7
                ventas:
                  type: integer
                  example: 30
      responses:
        '200':
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto actualizado exitosamente
        '400':
          description: Error en la validación de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Productos
      summary: Eliminar producto
      description: Elimina un producto del sistema
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del producto
      responses:
        '200':
          description: Producto eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto eliminado exitosamente
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =================
  # CATEGORÍAS ENDPOINTS
  # =================
  /api/categorias:
    get:
      tags:
        - Categorías
      summary: Obtener todas las categorías
      description: Retorna una lista de todas las categorías disponibles
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/categorias/{id}:
    get:
      tags:
        - Categorías
      summary: Obtener categoría por ID
      description: Retorna una categoría específica por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la categoría
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '404':
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/categorias/{categoriaId}/productos:
    get:
      tags:
        - Categorías
      summary: Obtener productos por categoría
      description: Retorna todos los productos de una categoría específica
      parameters:
        - name: categoriaId
          in: path
          required: true
          schema:
            type: integer
          description: ID de la categoría
      responses:
        '200':
          description: Lista de productos de la categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '404':
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =================
  # PEDIDOS ENDPOINTS
  # =================
  /api/pedidos:
    get:
      tags:
        - Pedidos
      summary: Obtener pedidos del usuario
      description: Retorna los pedidos del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Pedidos
      summary: Crear nuevo pedido
      description: Crea un nuevo pedido desde el carrito
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - total
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id_producto
                      - cantidad
                      - precio_unitario
                    properties:
                      id_producto:
                        type: integer
                        example: 1
                      cantidad:
                        type: integer
                        minimum: 1
                        example: 2
                      precio_unitario:
                        type: number
                        format: float
                        example: 15.99
                total:
                  type: number
                  format: float
                  example: 31.98
                recomendaciones:
                  type: string
                  example: Sin cebolla, por favor
      responses:
        '201':
          description: Pedido creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Error en la validación de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pedidos/{id}:
    get:
      tags:
        - Pedidos
      summary: Obtener pedido por ID
      description: Retorna un pedido específico por su ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Pedidos
      summary: Actualizar pedido
      description: Actualiza un pedido existente
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id_producto:
                        type: integer
                      cantidad:
                        type: integer
                      precio_unitario:
                        type: number
                        format: float
                total:
                  type: number
                  format: float
      responses:
        '200':
          description: Pedido actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Error en la validación de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Pedidos
      summary: Eliminar pedido
      description: Elimina un pedido del sistema
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      responses:
        '200':
          description: Pedido eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pedido eliminado exitosamente
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =================
  # CARRITO ENDPOINTS
  # =================
  /api/pedidos/carrito:
    get:
      tags:
        - Carrito
      summary: Obtener carrito del usuario
      description: Retorna el carrito actual del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Carrito del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pedidos/carrito/add:
