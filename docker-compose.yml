version: "3.8"

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: sabor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sabor_root_2024}
      MYSQL_DATABASE: ${DB_NAME:-sabor_production_db}
      MYSQL_USER: ${DB_USER:-sabor_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sabor_password_2024}
      MYSQL_CHARSET: utf8_general_ci
      MYSQL_COLLATION: utf8_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/migration_payu.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    networks:
      - sabor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Aplicación principal
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sabor-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sabor_production_db}
      DB_USER: ${DB_USER:-sabor_user}
      DB_PASSWORD: ${DB_PASSWORD:-sabor_password_2024}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PAYU_API_LOGIN: ${PAYU_API_LOGIN}
      PAYU_API_KEY: ${PAYU_API_KEY}
      PAYU_MERCHANT_ID: ${PAYU_MERCHANT_ID}
      PAYU_ACCOUNT_ID: ${PAYU_ACCOUNT_ID}
      PAYU_TEST_MODE: ${PAYU_TEST_MODE:-false}
      TRUST_PROXY: true
      SESSION_SECURE: true
      COMPRESSION_ENABLED: true
      RATE_LIMIT_ENABLED: true
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
      - logs_data:/app/logs
    networks:
      - sabor-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx como reverse proxy (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: sabor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - sabor-network
    depends_on:
      - app
    profiles:
      - production

  # Redis para caché y sesiones (opcional)
  redis:
    image: redis:7-alpine
    container_name: sabor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sabor_redis_2024}
    volumes:
      - redis_data:/data
    networks:
      - sabor-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  redis_data:
    driver: local

networks:
  sabor-network:
    driver: bridge
