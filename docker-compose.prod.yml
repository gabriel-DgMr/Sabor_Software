version: "3.8"

# Configuración específica para producción
services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backup:/backup
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      - uploads_prod_data:/app/public/uploads
      - logs_prod_data:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - uploads_prod_data:/var/www/uploads:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis:
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  mysql_prod_data:
    external: true
  uploads_prod_data:
    external: true
  logs_prod_data:
    external: true
  redis_prod_data:
    external: true
