repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        description: "Elimina espacios en blanco al final de las líneas"
      - id: end-of-file-fixer
        description: "Asegura que los archivos terminen con una nueva línea"
      - id: check-yaml
        description: "Valida sintaxis de archivos YAML"
      - id: check-added-large-files
        description: "Previene commits de archivos grandes"
        args: ["--maxkb=500"]
      - id: check-merge-conflict
        description: "Detecta conflictos de merge"
      - id: mixed-line-ending
        description: "Normaliza finales de línea"
        args: ["--fix=lf"]
      - id: check-case-conflict
        description: "Detecta conflictos de mayúsculas/minúsculas"

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.33.2
          - eslint-config-react-app@7.0.1
          - "@typescript-eslint/parser@7.1.0"
          - "@typescript-eslint/eslint-plugin@7.1.0"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json]
        additional_dependencies:
          - prettier@3.1.0

  - repo: local
    hooks:
      - id: frontend-tests
        name: Frontend Tests
        entry: bash -c 'cd frontend && npm test -- --watchAll=false'
        language: system
        pass_filenames: false
        types: [javascript, jsx, ts, tsx]
        stages: [push]

      - id: backend-tests
        name: Backend Tests
        entry: bash -c 'cd backend && npm test'
        language: system
        pass_filenames: false
        types: [javascript]
        stages: [push]

      - id: frontend-lint
        name: Frontend Lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        types: [javascript, jsx, ts, tsx]

      - id: backend-lint
        name: Backend Lint
        entry: bash -c 'cd backend && npm run lint'
        language: system
        pass_filenames: false
        types: [javascript]
